<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06101d"><title>CruLox · Cargando</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#06101d;color:#d7f7ff;font:500 16px system-ui,sans-serif}main{text-align:center;max-width:330px;padding:28px}strong{color:#03d8ed;font-size:28px;letter-spacing:.14em}p{line-height:1.6;color:#9cbbca}</style></head><body><main id="crulox-boot"><strong>CRULOX</strong><p>Iniciando plataforma digital…</p></main><script>
(async()=>{try{const urls=Array.from({length:18},(_,i)=>'./source/'+String(i).padStart(2,'0')+'.bin');const chunks=await Promise.all(urls.map(async url=>{const res=await fetch(url,{cache:'default'});if(!res.ok)throw Error('No se pudo cargar '+url);return new Uint8Array(await res.arrayBuffer())}));const total=chunks.reduce((n,a)=>n+a.byteLength,0);const bytes=new Uint8Array(total);let offset=0;for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.byteLength}const html=new TextDecoder('utf-8',{fatal:true}).decode(bytes);if(!html.startsWith('<!DOCTYPE html>'))throw Error('Archivo inicial no válido');document.open();document.write(html);document.close()}catch(e){console.error('CruLox carga',e);document.querySelector('#crulox-boot p').textContent='No fue posible cargar CruLox. Comprueba tu conexión y vuelve a abrir la plataforma.'}})();
</script></body></html>
